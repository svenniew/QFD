<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>QFD Tool</title>
<meta name="description" content="House of Quality intuitiv ausfüllen – WAS/WIE erweitern, Felder direkt in der Zelle belegen, Diagramm als Code weitergeben.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<style>
:root{
  /* hell: Pflaume #602C61 als Hauptakzent, Petrol #14857E als Zweitakzent (Richtung/Bestwert/positive Korrelation) */
  --bg:#F5F2F5; --surface:#FFFFFF; --surface2:#F1ECF1; --ink:#26192A; --muted:#6F6072;
  --line:#D5C9D5; --line2:#E8DFE8;
  --accent:#602C61; --accent-soft:#EBDDEB; --accent-ink:#FFFFFF;
  --accent2:#14857E; --accent2-soft:#D6EEEB;
  --accent3:#FBC500; --accent3-soft:#FFF3CC; --accent3-ink:#7A5B00;
  --pos:#14857E; --pos-soft:#D6EEEB; --neg:#B33A3A; --neg-soft:#F7DFDF;
  --danger:#B33A3A; --shadow:0 10px 28px rgba(60,30,60,.18);
  --cw:56px; --rh:48px; --lw:220px; --ww:48px; --aw:44px; --lbw:200px; --fbw:92px;
  --hlb:.86; --hlb2:.72;
  --fd:"Barlow Semi Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --fb:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191320; --surface:#231B2A; --surface2:#2C2334; --ink:#EFE8F0; --muted:#A99AAC;
    --line:#483C4E; --line2:#382E3E;
    --accent:#C98FCA; --accent-soft:#3F2A41; --accent-ink:#1A1320;
    --accent2:#4FC6BA; --accent2-soft:#173D39;
  --accent3:#FFD23F; --accent3-soft:#3D3212; --accent3-ink:#FFD23F;
    --accent3:#FFD23F; --accent3-soft:#3D3212; --accent3-ink:#FFD23F;
    --pos:#4FC6BA; --pos-soft:#173D39; --neg:#E47777; --neg-soft:#452424;
    --danger:#E47777; --shadow:0 10px 28px rgba(0,0,0,.55);
    --hlb:1.4; --hlb2:1.9;
  }
}
:root[data-theme="dark"]{
  --bg:#191320; --surface:#231B2A; --surface2:#2C2334; --ink:#EFE8F0; --muted:#A99AAC;
  --line:#483C4E; --line2:#382E3E;
  --accent:#C98FCA; --accent-soft:#3F2A41; --accent-ink:#1A1320;
  --accent2:#4FC6BA; --accent2-soft:#173D39;
  --accent3:#FFD23F; --accent3-soft:#3D3212; --accent3-ink:#FFD23F;
  --pos:#4FC6BA; --pos-soft:#173D39; --neg:#E47777; --neg-soft:#452424;
  --danger:#E47777; --shadow:0 10px 28px rgba(0,0,0,.55);
    --hlb:1.4; --hlb2:1.9;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.4;
  padding-inline:12px;padding-block:0 10px;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;min-height:100%}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--fd);font-weight:600;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--fd);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.m{color:var(--muted);font-size:12.5px}
input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input[type=text]:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- Kopf ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:10px 8px;border-bottom:1px solid var(--line)}
.top .brand{display:flex;flex-direction:column;gap:1px;min-width:120px}
.top .brand h1{font-size:18px;line-height:1.1}
.top .proj{flex:0 1 260px;display:flex;align-items:center;gap:8px}
.top .proj input{flex:1;font-family:var(--fd);font-size:16px;font-weight:600}
.top .actions{display:flex;gap:6px;flex-wrap:wrap}
#btnMenu{display:none;width:44px;padding:0;justify-content:center;font-size:18px;margin-left:auto}
@media (max-width:760px){
  .top{gap:8px}
  .top .brand{min-width:0}
  .top .brand h1{font-size:17px}
  .top .proj{flex:1 1 90px;min-width:0}
  #btnMenu{display:inline-flex}
  .top .actions{position:fixed;top:calc(8px + env(safe-area-inset-top,0px) + 44px);right:12px;z-index:60;
    flex-direction:column;align-items:stretch;gap:4px;width:180px;padding:8px;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:none}
  body.menu-open .top .actions{display:flex}
  .top .actions .btn{justify-content:flex-start;height:40px}
}
.btn{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
#btnTheme{width:40px;padding:0;justify-content:center;font-size:17px}

/* ---------- Palette ---------- */
.sy{width:18px;height:18px;display:inline-block;vertical-align:middle}

@media (pointer:coarse){
  .del{width:32px;height:32px;font-size:18px}
  .add{height:36px;min-width:36px}
  .vt[contenteditable]{font-size:16px}
  .ht{font-size:13px;line-height:1.15;padding:3px 6px}
  .zoombar button{width:40px;height:40px}
}

.phases{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-block:8px 6px}
.ph{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);cursor:pointer;font-size:12.5px;color:var(--muted);white-space:nowrap}
.ph b{font-family:var(--fd);font-weight:600;color:var(--ink)}
.ph.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ph.on b{color:var(--accent-ink)}
@media (hover:hover){ .ph:hover{border-color:var(--accent)} }
.ph.add{border-style:dashed;border-color:var(--accent2);color:var(--accent2);padding:0 12px}
.ph .x{margin-left:2px;opacity:.7}
.ph .p2{color:inherit}
@media (max-width:760px){
  .phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding-block:6px 4px}
  .ph{flex-direction:column;justify-content:center;height:auto;min-height:40px;padding:4px 2px;gap:0;min-width:0;
    font-size:10.5px;letter-spacing:-.1px;line-height:1.2;text-align:center;overflow:hidden;white-space:normal;overflow-wrap:normal;word-break:keep-all;hyphens:none}
  .ph b{display:none}
  .ph .p1,.ph .p2{display:block;width:100%;overflow:hidden;text-overflow:ellipsis}
  .ph .x{position:absolute}
  .ph{position:relative}
  .ph .x{top:1px;right:3px;font-size:12px}
  .ph.add .p1{font-size:14px;font-weight:600}
}

/* ---------- Bühne (skaliert, zentriert, zoombar) ---------- */
.work{flex:1;display:flex;gap:10px;min-height:240px}
.stage{position:relative;flex:1;min-width:0;min-height:0;overflow:auto;display:flex;border:1px solid var(--line2);border-radius:10px;background:var(--surface2);
  touch-action:none;overscroll-behavior:contain}
.zoomer{margin:auto;flex:none;position:relative}
#house{display:block;width:max-content;transform-origin:0 0}
.zoombar{position:fixed;right:18px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.zoombar button{width:34px;height:34px;border-radius:7px;border:1px solid transparent;background:none;cursor:pointer;font-size:17px;line-height:1;font-family:var(--fd);font-weight:600}
.zoombar button:hover{background:var(--accent2-soft);border-color:var(--accent2);color:var(--accent2)}
.zoombar .pct{min-width:44px;text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- Haus ---------- */
table.hoq{border-collapse:separate;border-spacing:0;table-layout:fixed;font-variant-numeric:tabular-nums}
.c-lbl{width:var(--lw)} .c-wgt{width:var(--ww)} .c-how{width:var(--cw)} .c-add{width:var(--aw)}
.hoq td,.hoq th{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0;height:var(--rh);text-align:center;vertical-align:middle;background:var(--surface);font-weight:normal}
.hoq th.lbl{font-family:var(--fd);font-weight:500;font-size:13px;text-align:right;padding:0 10px;color:var(--muted)}
.hoq .lbl{border-left:1px solid var(--line2)}
.hoq .addc{background:transparent;border-color:transparent}
.hoq .blank{background:var(--surface2)}
.hoq td.ph{background:var(--surface2);color:var(--muted);font-size:12px;padding:6px}
.cell{cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-size:20px;line-height:1}
@media (hover:hover){ .cell:hover{background:var(--accent-soft)} }
td.rel{color:var(--accent)}
td.rel .sy{width:22px;height:22px}
td.rel.v0::after,td.wgt.todo::after,td.rate.todo::after{content:"?";font-family:var(--fd);font-weight:700;font-size:17px;color:var(--accent3);opacity:.55}
td.rel.v0:not(.editing):hover::after{opacity:.9}
td.seen::after{content:none !important}
.ev td.rel::after,.ev td.wgt::after,.ev td.rate::after{content:none}
td.editing::after{content:none !important}
td.wgt{font-family:var(--fd);font-weight:600;font-size:17px}
td.dir{color:var(--accent2)}
td.dir .sy{width:19px;height:19px}
.hoq .r-dir td,.hoq .r-dir th{height:32px}
.hoq .r-how td,.hoq .r-how th{height:156px;vertical-align:bottom}
.vt{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;max-height:146px;max-width:100%;
  font-family:var(--fb);font-weight:normal;font-size:13.5px;line-height:1.15;padding:5px 0;overflow:hidden;overflow-wrap:anywhere;text-align:left}
.vt.small{font-size:12px;color:var(--muted);max-height:70px;font-family:var(--fb);font-weight:normal}
.vt[contenteditable]{height:112px;width:calc(var(--cw) - 10px);max-height:none;border:1px solid transparent;border-radius:6px;cursor:text;padding:6px 4px;line-height:1.2;margin-bottom:4px;box-sizing:border-box;background:transparent}
.vt.small[contenteditable]{height:60px;margin-bottom:32px}
@media (hover:hover){ td:hover > .vt[contenteditable], .vt[contenteditable]:hover{border-color:var(--line)} }
.vt[contenteditable]:focus{background:var(--surface);outline:2px solid var(--accent);outline-offset:1px}
.hoq .r-tgt td,.hoq .r-tgt th{height:98px;vertical-align:bottom}
.hoq td.tgt{position:relative}
.rot{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:26px;height:24px;border-radius:6px;border:1px solid var(--line2);background:var(--surface2);color:var(--accent2);cursor:pointer;font-family:var(--fd);font-weight:600;font-size:14px;line-height:1;padding:0}
@media (hover:hover){ .rot:hover{border-color:var(--accent2);background:var(--accent2-soft)} }
.hoq th.free{background:transparent;border:0;line-height:0}
.hoq th.tight{padding-right:0}
.lbox{display:inline-block;width:var(--lbw);text-align:right;height:32px;line-height:31px;padding:0 8px;background:var(--surface);border:1px solid var(--line2);border-right:none;border-top:none;vertical-align:bottom;box-sizing:border-box;white-space:nowrap}
.lbox.wiebox{height:auto;line-height:1.25;padding:6px 8px;border-top:none}
.lbox.wiebox .sub{display:block;margin:2px 0 0}
.hoq th.tg{vertical-align:bottom !important}
.fbox{display:inline-block;width:var(--fbw);height:var(--rh);line-height:calc(var(--rh) - 1px);padding:0 8px;text-align:right;background:var(--surface);border:1px solid var(--line2);border-top:none;box-sizing:border-box;vertical-align:bottom;white-space:nowrap}
.fbox.tbox{border-top:1px solid var(--line2);line-height:calc(var(--rh) - 2px)}
.hoq th.flbl{font-family:var(--fd);font-weight:500;font-size:12.5px;text-align:right;padding:0 8px;color:var(--muted);border-left:1px solid var(--line2)}
.hoq .r-tgt th.flbl{border-top:1px solid var(--line2);vertical-align:bottom;padding-bottom:10px}
.hoq th.cmp-title{text-align:center;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.hoq td.how-h{position:relative}
.del.col{position:absolute;top:auto;bottom:4px;left:50%;transform:translateX(-50%);width:28px;height:28px;font-size:17px}
.del{color:var(--danger);opacity:0;pointer-events:none}
td.how-h:focus-within .del,td.lbl:focus-within .del,td.act .del,.del.armed{opacity:1;pointer-events:auto}
.del.armed{width:auto;min-width:34px;padding:0 6px;font-size:14px}
@media (hover:hover){ td.how-h:hover .del,td.lbl:hover .del{opacity:.55;pointer-events:auto} td.how-h:hover .del:hover,td.lbl:hover .del:hover{opacity:1} }
.hoq td.rate{font-family:var(--fd);font-weight:600;font-size:16px;color:var(--accent2)}
.hoq .first{border-left:1px solid var(--line2)}
.hoq td.hl{background:color-mix(in srgb, var(--accent) 20%, var(--surface))}
.hoq td.hl2{background:color-mix(in srgb, var(--accent) 42%, var(--surface)) !important}
.rc.hl > polygon{fill:color-mix(in srgb, var(--accent) 20%, var(--surface))}
.rc.hl.v1 > polygon,.rc.hl.v2 > polygon{fill:color-mix(in srgb, var(--accent) 22%, var(--pos-soft))}
.rc.hl.v-1 > polygon,.rc.hl.v-2 > polygon{fill:color-mix(in srgb, var(--accent) 22%, var(--neg-soft))}
.rc.hl2 > polygon{fill:color-mix(in srgb, var(--accent) 42%, var(--surface));stroke:var(--accent);stroke-width:1.5}
.rc.hl2.v1 > polygon,.rc.hl2.v2 > polygon{fill:color-mix(in srgb, var(--accent) 40%, var(--pos-soft))}
.rc.hl2.v-1 > polygon,.rc.hl2.v-2 > polygon{fill:color-mix(in srgb, var(--accent) 40%, var(--neg-soft))}
.rc.editing.hl2 > polygon{fill:var(--surface)}
.hoq .r-whead th,.hoq tr.first td.rel,.hoq tr.first td.rate,.hoq .r-tgt td.tgt,.hoq td.cmp-h{border-top:1px solid var(--line2)}
.hoq .r-whead th{height:40px;font-family:var(--fd);font-size:12px;color:var(--muted);text-align:center;padding:0}
.hoq .r-whead th.lbl{text-align:left;padding-left:10px}
.hoq .r-whead th.lbl .sub{font-family:var(--fb);font-size:12px;color:var(--muted);margin-left:8px}
.hoq th.wie{vertical-align:top !important;padding-top:0;font-weight:600;color:var(--ink);white-space:nowrap}
.hoq th.wie .sub{font-family:var(--fb);font-weight:normal;font-size:12px;color:var(--muted);margin-left:8px}
.hoq .r-whead th.lbl{font-weight:600;color:var(--ink)}
.hoq th.cmp-title{background:var(--surface);border:1px solid var(--line2);border-bottom:none;text-align:center}
.what{display:flex;align-items:center;gap:4px;padding:3px 4px 3px 8px;width:100%}
.hoq td.wgt.fixed{font-family:var(--fd);font-weight:600;font-size:var(--fs-val);color:var(--muted);background:var(--surface2)}
.ht.ro{color:var(--muted)}
.ht{flex:1;min-width:0;height:40px;text-align:left;border:1px solid transparent;border-radius:6px;padding:4px 6px;font-family:var(--fb);font-size:13.5px;line-height:1.2;overflow:hidden;overflow-wrap:anywhere;cursor:text;background:transparent;box-sizing:border-box;outline:none}
@media (hover:hover){ td.lbl:hover .ht, .ht:hover{border-color:var(--line)} }
.ht:focus{background:var(--surface);outline:2px solid var(--accent);outline-offset:1px}
.del{width:26px;height:26px;border-radius:6px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;flex:none}
@media (hover:hover){ .del:hover{color:var(--danger);border-color:var(--danger)} }
.del.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.add{height:32px;min-width:32px;padding:0 8px;border-radius:8px;border:1px dashed var(--accent2);background:transparent;color:var(--accent2);cursor:pointer;font-family:var(--fd);font-weight:600;font-size:15px}
@media (hover:hover){ .add:hover{background:var(--accent2-soft)} }
.add.wide{width:100%;text-align:left;padding-left:10px}
.hoq .r-add td{height:44px;text-align:center}
.leg{font-family:var(--fb);font-size:11px;color:var(--muted);opacity:.75;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.leg .sy{width:13px;height:13px;color:var(--accent);opacity:.8}
.hoq td.leg-l{text-align:left;padding-left:4px;white-space:nowrap}
.hoq td.leg-l .leg{margin-left:6px;vertical-align:middle}
.hoq td.leg-m{text-align:left;padding-left:2px}
.hoq td.roofleg{vertical-align:bottom;text-align:left;padding:0 0 6px 10px}
.rleg{display:flex;flex-direction:column;align-items:flex-start;gap:1px;line-height:1.35;font-size:10.5px}
.rleg b{color:var(--ink);font-weight:600;font-family:var(--fd);opacity:.9}
.rleg .p{color:var(--pos)} .rleg .n{color:var(--neg)}
@media (max-width:760px){ .hoq td.leg-l .leg{display:none} }
.hoq .r-calc td{font-family:var(--fd);font-weight:500;font-size:14px}
.hoq .r-calc td.top1{background:var(--accent2-soft);color:var(--accent2);font-weight:600}
.hoq .r-calc.pct td{font-size:13px;color:var(--muted)}
.hoq .r-roof td{background:transparent;border-color:transparent;height:auto;vertical-align:bottom}
.roofsvg{display:block}
.roofbg{fill:var(--surface);stroke:none}
.roofedge{fill:none;stroke:var(--line2);stroke-width:1}
.rb{fill:var(--surface);stroke:none}
.rb.hl{fill:color-mix(in srgb, var(--accent) 20%, var(--surface))}
.rc polygon{fill:var(--surface);stroke:var(--line2);stroke-width:1}
@media (hover:hover){ .rc:hover > polygon{fill:var(--accent-soft)} }
.rc.v1 polygon,.rc.v2 polygon{fill:var(--pos-soft)}
.rc.v-1 polygon,.rc.v-2 polygon{fill:var(--neg-soft)}
.rc text.q{fill:var(--accent3) !important;opacity:.6;font-size:17px}
.rc text{font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:.02em;fill:var(--muted);pointer-events:none}
.rc.v1 text,.rc.v2 text{fill:var(--pos)}
.rc.v-1 text,.rc.v-2 text{fill:var(--neg)}
.rc{cursor:pointer}
.roof-empty{height:14px}

/* ---------- Auswahl in der Zelle (Kandidaten) ---------- */
td.editing{background:var(--surface2);outline:2px solid var(--accent);outline-offset:-2px}
td.editing:hover{background:var(--surface2)}
.cands{display:grid;width:100%;height:calc(var(--rh) - 2px);gap:1px;padding:2px;box-sizing:border-box;grid-auto-rows:minmax(0,1fr);overflow:hidden}
.r-dir .cands{height:30px}
.cands.g2{grid-template-columns:1fr 1fr}
.cands.g3{grid-template-columns:repeat(3,1fr)}
.cand{border:0;border-radius:4px;background:none;color:var(--muted);opacity:.5;padding:0;margin:0;cursor:pointer;min-width:0;min-height:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:600;font-size:12px;line-height:1}
td.rel .cand .sy,.cand .sy{width:13px;height:13px}
.cand.x{font-size:16px}
@media (hover:hover){ .cand:hover{opacity:1;background:var(--accent-soft);color:var(--accent)} }
.cand.cur{opacity:1;color:var(--accent);background:var(--accent-soft)}
.cand.p{color:var(--pos)} .cand.n{color:var(--neg)}
.rc.editing > polygon{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.rc.editing > text{display:none}
.rc .cand{cursor:pointer;pointer-events:all}
.rc .cand polygon{fill:var(--surface);stroke:var(--line2);stroke-width:1}
.rc .cand text{fill:var(--muted);opacity:.8;display:block;pointer-events:none;font-family:var(--fd);font-weight:700}
.rc .cand.p text{fill:var(--pos)} .rc .cand.n text{fill:var(--neg)}
@media (hover:hover){ .rc .cand:hover polygon{fill:var(--accent-soft)} }
@media (hover:hover){ .rc .cand:hover text{opacity:1} }
.rc .cand.cur text{opacity:1}
.rc .cand.cur polygon{fill:var(--accent-soft)}
.rc .cand.x circle{fill:var(--line);stroke:var(--surface);stroke-width:2}

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const REL = {
  9:'<svg class="sy" viewBox="0 0 20 20" aria-label="stark"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="10" cy="10" r="2.6" fill="currentColor"/></svg>',
  3:'<svg class="sy" viewBox="0 0 20 20" aria-label="mittel"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>',
  1:'<svg class="sy" viewBox="0 0 20 20" aria-label="schwach"><polygon points="3.5,15.5 16.5,15.5 10,3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>'
}, RELN = {9:'Stark',3:'Mittel',1:'Schwach'};
document.querySelectorAll('[data-sym]').forEach(el=>{ el.innerHTML = REL[el.dataset.sym] + el.innerHTML; });
const ROOF = {2:'++',1:'+','-1':'−','-2':'−−'}, ROOFN = {2:'Stark positiv',1:'Positiv','-1':'Negativ','-2':'Stark negativ'};
const DIR = {
  1:'<svg class="sy" viewBox="0 0 20 20" aria-label="maximieren"><path d="M10 17V4M4.5 9.5 10 4l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  '-1':'<svg class="sy" viewBox="0 0 20 20" aria-label="minimieren"><path d="M10 3v13M4.5 10.5 10 16l5.5-5.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  0:'<svg class="sy" viewBox="0 0 20 20" aria-label="Zielwert"><polygon points="10,3 17,10 10,17 3,10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/></svg>'
}, DIRN = {1:'Maximieren – je größer, desto besser','-1':'Minimieren – je kleiner, desto besser',0:'Zielwert treffen'};
const LS = 'qfd.werkstatt.state';

let DOC, S, brush = null, painting = false, edit = null;
const STAGES = ['Kundenanforderungen','Qualitätsmerkmale','Funktionen','Konstruktionsmerkmale','Prozessmerkmale'];
const SHORT  = ['Kunde','Qualität','Funktion','Konstruktion','Prozess'];
const MAXPH = STAGES.length - 1;
const house = $('#house'), stage = $('#stage'), zoomer = $('#zoomer'), zPct = $('#zPct');

/* ---------- Zustand ---------- */
function mk(m, n){
  return { title:'', author:'', seen:{}, whats:Array.from({length:m},()=>({name:'',w:0})),
    hows:Array.from({length:n},()=>({name:'',dir:1,target:''})),
    rel:Array.from({length:m},()=>Array(n).fill(0)),
    roof:Array.from({length:n},()=>Array(n).fill(0)),
    comps:[], rate:Array.from({length:m},()=>[]) };
}
function mkDoc(m, n){ return { title:'', author:'', active:0, phases:[mk(m,n)] }; }
/* WAS der Folgephase = WIE der Vorphase; Gewichtung = Bedeutung, auf 1–5 skaliert */
function syncPhase(k){
  if(k<=0) return;
  const prev = DOC.phases[k-1], cur = DOC.phases[k];
  const {abs} = computeFor(prev), max = Math.max(...abs, 0);
  const names = prev.hows.map(h=>h.name);
  const m = names.length, n = cur.hows.length;
  cur.whats = names.map((nm,i)=>({name:nm, w: max ? Math.max(1, Math.round(abs[i]/max*5)) : 0}));
  cur.rel = Array.from({length:m},(_,i)=>Array.from({length:n},(_,j)=>(cur.rel[i] && cur.rel[i][j])||0));
  cur.rate = Array.from({length:m},(_,i)=>Array.from({length:cur.comps.length},(_,c)=>(cur.rate[i] && cur.rate[i][c])||0));
}
function sample(){
  const d = mkDoc(5,5), s = d.phases[0];
  d.title = 'Glas-Ladegabel (Beispiel)';
  [['Hohe Tragfähigkeit',5],['Geringes Eigengewicht',4],['Schnelles Be- und Entladen',4],['Lange Lebensdauer',3],['Günstiger Preis',2]]
    .forEach((a,i)=>{ s.whats[i] = {name:a[0], w:a[1]}; });
  [['Tragkraft',1,'≥ 250 kg'],['Eigengewicht',-1,'≤ 12 kg'],['Federrate',0,'N/mm'],['Anzahl Bauteile',-1,'Stk.'],['Blechstärke',0,'mm']]
    .forEach((a,j)=>{ s.hows[j] = {name:a[0], dir:a[1], target:a[2]}; });
  s.rel = [[9,3,3,0,9],[3,9,0,3,9],[0,3,9,1,0],[3,0,3,1,9],[1,3,0,9,3]];
  s.roof[0][1] = -2; s.roof[0][4] = 2; s.roof[1][4] = -2; s.roof[1][3] = 1; s.roof[2][4] = 1;
  s.comps = [{name:'Wir'},{name:'Wettbewerber A'}];
  s.rate = [[4,3],[3,4],[2,4],[4,3],[3,2]];
  return d;
}
function computeFor(ph, rel = ph.rel){
  const n = ph.hows.length, abs = Array(n).fill(0);
  ph.whats.forEach((w,i)=>ph.hows.forEach((h,j)=>{ abs[j] += (w.w||0) * ((rel[i]&&rel[i][j])||0); }));
  const total = abs.reduce((a,b)=>a+b,0);
  const pct = abs.map(a=>total?a/total*100:0);
  const order = abs.map((a,j)=>j).sort((a,b)=>abs[b]-abs[a]);
  const rank = Array(n).fill(0); let r = 0;
  order.forEach((j,k)=>{ if(k===0 || abs[j]!==abs[order[k-1]]) r = k+1; rank[j] = abs[j]>0 ? r : 0; });
  return {abs, pct, rank};
}
const compute = (rel = S.rel) => computeFor(S, rel);
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(()=>{ try{ localStorage.setItem(LS, JSON.stringify(DOC)); }catch(e){} }, 250); }

/* ---------- Rendern ---------- */
const cssPx = name => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)) || 0;
function roofSvg(n){
  const CW = cssPx('--cw') || 56, H = n*CW/2, W = n*CW;
  let s = `<svg class="roofsvg" width="${W}" height="${H+1}" viewBox="0 0 ${W} ${H+1}" aria-label="Korrelationsdach"><polygon class="roofbg" points="0,${H+1} ${W},${H+1} ${W/2},0"/>`;
  for(let j=0;j<n;j++) s += `<polygon class="rb" data-col="${j}" points="${j*CW},${H+1} ${(j+1)*CW},${H+1} ${(j+0.5)*CW},${H+1-CW/2}"/>`;
  s += `<polyline class="roofedge" points="0,${H+1} ${W/2},0 ${W},${H+1}"/>`;
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
    const cx = (i+j+1)/2*CW, cy = H-(j-i)*CW/2, h = CW/2, v = S.roof[i][j]||0;
    s += `<g class="rc v${v}" data-cell="roof" data-i="${i}" data-j="${j}" data-cx="${cx}" data-cy="${cy}" data-h="${h}"><polygon points="${cx},${cy-h} ${cx+h},${cy} ${cx},${cy+h} ${cx-h},${cy}"/><text class="${!v && !isSeen('roof',i,j) ? 'q' : ''}" x="${cx}" y="${cy+5.5}" text-anchor="middle">${ROOF[v] || (!isSeen('roof',i,j) ? '?' : '')}</text></g>`;
  }
  return s+'</svg>';
}
function render(){
  edit = null;
  const n = S.hows.length, nc = Math.max(n,1), c = S.comps.length, cc = Math.max(c,1);
  const hows = f => n ? S.hows.map((h,j)=>f(h,j)).join('') : '';
  const cmps = f => S.comps.map((x,k)=>f(x,k)).join('');
  const ph = n ? '' : '<td class="ph"></td>';
  const gapR = `<td class="addc" colspan="${cc+1}"></td>`, gapC = '<td class="addc"></td>', cph = c ? '' : gapC;
  const fst = j => j===0 ? ' first' : '';
  const tw = cssPx('--lw') + cssPx('--ww') + (nc+cc)*cssPx('--cw') + 3*cssPx('--aw');
  let h = `<table class="hoq" id="hoq" style="width:${tw}px"><colgroup><col class="c-lbl"><col class="c-wgt"><col class="c-add">${'<col class="c-how">'.repeat(nc)}<col class="c-add">${'<col class="c-how">'.repeat(cc)}<col class="c-add"></colgroup><tbody>`;
  /* WIE-Block: Dach + Optimierung + Merkmale */
  h += `<tr class="r-roof"><td class="addc" colspan="2"></td>${gapC}<td colspan="${nc}">${n>=2?roofSvg(n):'<div class="roof-empty"></div>'}</td>${gapC}`
     + `<td class="addc roofleg" colspan="${cc+1}"><div class="leg rleg"><b>Korrelation:</b><span class="p">++ = stark positiv</span><span class="p">+ = positiv</span><span class="n">− = negativ</span><span class="n">−− = stark negativ</span></div></td></tr>`;
  h += `<tr class="r-dir"><th class="lbl free tight" colspan="3"><span class="lbox">Optimierung</span></th>${hows((x,j)=>`<td class="cell dir${fst(j)}" data-cell="dir" data-j="${j}" title="${DIRN[x.dir]}">${DIR[x.dir]}</td>`)}${ph}${gapC}<th class="lbl cmp-title" colspan="${c>=2 ? cc : cc+1}">Wettbewerb</th>${c>=2 ? gapC : ''}</tr>`;
  h += `<tr class="r-how"><th class="lbl free tight wie" colspan="3"><span class="lbox wiebox">WIE?<span class="sub">${STAGES[DOC.active+1]}</span></span></th>`
     + hows((x,j)=>`<td class="cell how-h${fst(j)}" data-cell="how" data-j="${j}"><button class="del col" type="button" tabindex="-1" data-act="delHow" data-j="${j}" title="Spalte löschen">×</button><span class="vt" contenteditable="true" spellcheck="false" data-hown="${j}">${esc(x.name)}</span></td>`)
     + (n ? '' : '<td class="ph"></td>')
     + `<td class="addc"><button class="add" type="button" tabindex="-1" data-act="addHow" title="Merkmal hinzufügen">+</button></td>`

  /* Fußtabelle: Labels rahmenlos, Zellen nur unter den Merkmalen */

  h += `<tr class="r-calc abs"><th class="lbl free tight" colspan="3"><span class="fbox">Bedeutung</span></th>${hows((x,j)=>`<td data-abs="${j}"></td>`)}${ph}${gapC}${gapR}</tr>`;

  h += `<tr class="r-calc"><th class="lbl free tight" colspan="3"><span class="fbox">Rang</span></th>${hows((x,j)=>`<td data-rank="${j}"></td>`)}${ph}${gapC}${gapR}</tr>`;
  h += '</tbody></table>';
  house.innerHTML = h;
  house.innerHTML = h;
  renderPhases();
  $('#title').value = DOC.title;

  if(mode==='eval') decorateEval(); else house.classList.remove('ev');

function updateFooter(rel = S.rel){

/* eine Zelle aus dem Zustand neu zeichnen (auch: Bearbeitungsmodus verlassen) */
const seenKey = (kind,i,j) => kind==='rel' ? `r${i}_${j}` : kind==='w' ? `w${i}` : kind==='rate' ? `c${i}_${j}` : kind==='roof' ? `f${i}_${j}` : '';
const isSeen = (kind,i,j) => !!(S.seen && S.seen[seenKey(kind,i,j)]);

  else if(kind==='rate'){ const el = house.querySelector(`td[data-cell="rate"][data-i="${i}"][data-j="${j}"]`); if(!el) return; el.classList.remove('editing'); el.classList.toggle('todo', !S.rate[i][j]); el.classList.toggle('seen', isSeen('rate',i,j)); el.textContent = S.rate[i][j]||''; }
  else if(kind==='roof'){ const g = house.querySelector(`g[data-cell="roof"][data-i="${i}"][data-j="${j}"]`); if(!g) return; const v = S.roof[i][j]||0; g.setAttribute('class', `rc v${v}`); g.querySelectorAll('.cands').forEach(c=>c.remove());
    const tx = g.querySelector('text'), open = !v && !isSeen('roof',i,j);

/* ---------- Bühne: Bildschirmgröße abfragen, einpassen, zoomen ---------- */
let scale = 1, fitMode = true, natW = 0, natH = 0;
function stageSize(){
  const work = $('#work'), top = work.getBoundingClientRect().top;
  work.style.height = Math.max(240, window.innerHeight - top - 10) + 'px';
}
function measure(){ const t = $('#hoq'); if(!t) return; natW = t.offsetWidth; natH = t.offsetHeight; }
function applyScale(s, keepCenter){
  const s0 = scale; scale = Math.max(0.2, Math.min(4, s));
  const cx = (stage.scrollLeft + stage.clientWidth/2)/s0, cy = (stage.scrollTop + stage.clientHeight/2)/s0;
  house.style.transform = `scale(${scale})`;
  zoomer.style.width = natW*scale + 'px'; zoomer.style.height = natH*scale + 'px';
  if(keepCenter){ stage.scrollLeft = cx*scale - stage.clientWidth/2; stage.scrollTop = cy*scale - stage.clientHeight/2; }
  zPct.textContent = Math.round(scale*100) + ' %';
}
function fit(){
  fitMode = true; measure(); if(!natW) return;
  const s = Math.min((stage.clientWidth-16)/natW, (stage.clientHeight-16)/natH);
  applyScale(Math.min(s, 2.5), false);
}
function layout(){ stageSize(); measure(); if(fitMode) fit(); else applyScale(scale, true); }
function zoomBy(f){ fitMode = false; applyScale(scale*f, true); }
const coarse = () => matchMedia('(pointer:coarse)').matches;
function zoomToCell(el){
  const r = el.getBoundingClientRect(); if(r.width >= 76) return;
  fitMode = false; applyScale(scale * 84 / r.width, true);
  const r2 = el.getBoundingClientRect(), st = stage.getBoundingClientRect();
  stage.scrollLeft += (r2.left + r2.width/2) - (st.left + st.width/2);
  stage.scrollTop += (r2.top + r2.height/2) - (st.top + st.height/2);
}
$('#zIn').addEventListener('click', ()=>zoomBy(1.25));
$('#zOut').addEventListener('click', ()=>zoomBy(1/1.25));
$('#zFit').addEventListener('click', fit);
stage.addEventListener('wheel', e=>{ if(e.ctrlKey || e.metaKey){ e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.1 : 1/1.1); } }, {passive:false});
/* Touch: ein Finger schiebt, zwei Finger zoomen */
const pts = new Map(); let pinch0 = null, pan0 = null;
const dist = () => { const a = [...pts.values()]; return Math.hypot(a[0][0]-a[1][0], a[0][1]-a[1][1]); };
const mid = () => { const a = [...pts.values()]; return [(a[0][0]+a[1][0])/2, (a[0][1]+a[1][1])/2]; };
stage.addEventListener('pointerdown', e=>{
  if(e.pointerType!=='touch') return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if(pts.size===1) pan0 = {x:e.clientX, y:e.clientY, sl:stage.scrollLeft, st:stage.scrollTop};
  if(pts.size===2){ const m = mid(); pinch0 = {d:dist(), cx:m[0], cy:m[1]}; pan0 = null; }
});
stage.addEventListener('pointermove', e=>{
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if(pts.size===2 && pinch0){
    fitMode = false;
    const r = stage.getBoundingClientRect(), m = mid(), d = dist();
    /* Inhaltspunkt unter dem alten Fingermittelpunkt … */
    const sx = (stage.scrollLeft + pinch0.cx - r.left)/scale, sy = (stage.scrollTop + pinch0.cy - r.top)/scale;
    applyScale(scale * d/pinch0.d, false);
    /* … bleibt unter dem neuen Mittelpunkt: zoomen und schieben in einem */
    stage.scrollLeft = sx*scale - (m[0] - r.left);
    stage.scrollTop = sy*scale - (m[1] - r.top);
    pinch0 = {d, cx:m[0], cy:m[1]};
  }
  else if(pts.size===1 && pan0){ stage.scrollLeft = pan0.sl - (e.clientX - pan0.x); stage.scrollTop = pan0.st - (e.clientY - pan0.y); }
});
const endTouch = e => { pts.delete(e.pointerId); if(pts.size<2) pinch0 = null; if(pts.size===0) pan0 = null; };
stage.addEventListener('pointerup', endTouch); stage.addEventListener('pointercancel', endTouch);
window.addEventListener('resize', ()=>{ exitEdit(); layout(); });

/* ---------- Änderungen ---------- */
function setRel(i,j,v){ S.rel[i][j] = v; paintCell('rel',i,j); updateFooter(); if(DOC.phases[DOC.active+1]) syncPhase(DOC.active+1); save(); }
function setRoof(i,j,v){ S.roof[i][j] = v; paintCell('roof',i,j); save(); }
function setW(i,v){ S.whats[i].w = v; paintCell('w',i); updateFooter(); if(DOC.phases[DOC.active+1]) syncPhase(DOC.active+1); save(); }
function setDir(j,v){ S.hows[j].dir = v; paintCell('dir',null,j); save(); }
const PFX = ['', '≥ ', '≤ ', '= '];
function pfxOf(t){ const m = /^(≥|≤|=|>=|<=)\s*/.exec(t||''); return m ? (m[1]==='>=' ? '≥ ' : m[1]==='<=' ? '≤ ' : m[1]+' ') : ''; }
function rotTgt(j){
  const t = S.hows[j].target||'', cur = pfxOf(t), rest = t.replace(/^(≥|≤|=|>=|<=)\s*/,'');
  S.hows[j].target = PFX[(PFX.indexOf(cur)+1)%PFX.length] + rest;

}

function addWhat(){
  S.whats.push({name:'',w:0}); S.rel.push(Array(S.hows.length).fill(0)); S.rate.push(Array(S.comps.length).fill(0)); render();
  const sp = house.querySelector(`[data-whatn="${S.whats.length-1}"]`); if(sp) focusEnd(sp);
}
function addHow(){
  S.hows.push({name:'',dir:1,target:''}); S.rel.forEach(r=>r.push(0));
  S.roof.forEach(r=>r.push(0)); S.roof.push(Array(S.hows.length).fill(0)); render();
  if(DOC.phases[DOC.active+1]) syncPhase(DOC.active+1);

}
function delWhat(i){ S.whats.splice(i,1); S.rel.splice(i,1); S.rate.splice(i,1); S.seen = {}; render(); }
function addCmp(){
  S.comps.push({name:''}); S.rate.forEach(r=>r.push(0)); render();
  const sp = house.querySelector(`[data-cmpn="${S.comps.length-1}"]`); if(sp) focusEnd(sp);
}
function delCmp(k){ S.seen = {}; S.comps.splice(k,1); S.rate.forEach(r=>r.splice(k,1)); render(); }
function delHow(j){ S.seen = {}; S.hows.splice(j,1); S.rel.forEach(r=>r.splice(j,1)); S.roof.splice(j,1); S.roof.forEach(r=>r.splice(j,1)); if(DOC.phases[DOC.active+1]) syncPhase(DOC.active+1); render(); }

/* ---------- Stempel ---------- */
function setBrush(b){
  brush = b;
  document.querySelectorAll('.br').forEach(el=>el.classList.toggle('on', !!b && el.dataset.brush===b.kind && (b.kind==='erase' || +el.dataset.v===b.v)));
  document.body.classList.toggle('brushing', !!b);
}
function applyBrush(el){
  const k = el.dataset.cell, i = +el.dataset.i, j = +el.dataset.j;
  if(brush.kind==='erase'){
    if(k==='rel') setRel(i,j,0); else if(k==='roof') setRoof(i,j,0); else if(k==='w') setW(i,0); else if(k==='rate') setRate(i,j,0); else return false;
    return true;
  }
  if(brush.kind!==k) return false;
  if(k==='rel') setRel(i,j,brush.v); else if(k==='roof') setRoof(i,j,brush.v);
  return true;
}

/* ---------- Auswahl direkt in der Zelle ---------- */
function candHtml(kind, cur){
  const c = (inner, v, cls='', tip='') => `<button type="button" class="cand ${cls}${cur===v?' cur':''}" data-set="${v}" title="${tip}">${inner}</button>`;
  const WN = {1:'unwichtig',2:'weniger wichtig',3:'wichtig',4:'sehr wichtig',5:'entscheidend'};
  const RN = {1:'deutlich schlechter',2:'schlechter',3:'gleichwertig',4:'besser',5:'deutlich besser'};
  if(kind==='rel') return `<div class="cands g2">${c(REL[9],9,'','Starke Beziehung (9)')}${c(REL[3],3,'','Mittlere Beziehung (3)')}${c(REL[1],1,'','Schwache Beziehung (1)')}${c('·',0,'x','Keine Beziehung (0)')}</div>`;
  if(kind==='w')   return `<div class="cands g3">${[1,2,3,4,5].map(n=>c(n,n,'',`Gewichtung ${n} – ${WN[n]}`)).join('')}</div>`;
  if(kind==='dir') return `<div class="cands g3">${[1,-1,0].map(d=>c(DIR[d],d,'',DIRN[d])).join('')}</div>`;
  if(kind==='rate') return `<div class="cands g3">${[1,2,3,4,5].map(n=>c(n,n,'',`Bewertung ${n} – ${RN[n]}`)).join('')}</div>`;
  return '';
}
function enterEdit(el){
  exitEdit();
  const kind = el.dataset.cell, i = +el.dataset.i, j = +el.dataset.j;
  edit = {kind, i, j, el};
  markSeen(kind, i, j);
  if(kind==='roof'){
    /* vier Teilrauten in den Ecken (Trennlinien parallel zu den Seiten): oben ++, links +, rechts −, unten −−; Mittelpunkt = leer */
    const cur = S.roof[i][j]||0, cx = +el.dataset.cx, cy = +el.dataset.cy, h = +el.dataset.h, q = h/2, fs = (h*0.62).toFixed(1);
    const sub = (x,y) => `${x},${y-q} ${x+q},${y} ${x},${y+q} ${x-q},${y}`;
    const quads = [[2,'p',cx,cy-q],[1,'p',cx-q,cy],[-1,'n',cx+q,cy],[-2,'n',cx,cy+q]].map(([v,cls,x,y])=>[v,cls,sub(x,y),x,y]);
    const g = document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('class','cands');
    g.innerHTML = quads.map(([v,cls,pts,x,y])=>`<g class="cand ${cls}${cur===v?' cur':''}" data-set="${v}"><title>${ROOFN[v]}</title><polygon points="${pts}"/><text x="${x}" y="${y}" dy="0.36em" text-anchor="middle" font-size="${fs}">${ROOF[v]}</text></g>`).join('')
      + `<g class="cand x${cur===0?' cur':''}" data-set="0"><title>Keine Korrelation</title><circle cx="${cx}" cy="${cy}" r="${(h*0.2).toFixed(1)}"/></g>`;
    el.appendChild(g); el.classList.add('editing'); if(el !== el.parentNode.lastElementChild) el.parentNode.appendChild(el);
  } else {
    const cur = kind==='rel' ? (S.rel[i][j]||0) : kind==='w' ? (S.whats[i].w||0) : kind==='rate' ? (S.rate[i][j]||0) : S.hows[j].dir;
    el.innerHTML = candHtml(kind, cur); el.classList.add('editing');
  }
  if(coarse()){
    zoomToCell(el);
    clearHl();
    hlEls = (kind==='rel' ? [...hlRow(i), ...hlCol(j)] : kind==='roof' ? [...hlRoof(i,j), ...hlCol(i), ...hlCol(j)]
           : kind==='rate' ? [...hlRow(i), ...hlCmp(j)] : kind==='w' ? hlRow(i) : hlCol(j)).filter(x=>x!==el);
    hlEls.forEach(x=>x.classList.add('hl'));
    showTip(el, kind, i, j);
  }
}
function exitEdit(){ if(!edit) return; const e = edit; edit = null; paintCell(e.kind, e.i, e.j); hideTip(); clearHl(); }
const tip = $('#ctip');
function hideTip(){ tip.hidden = true; }
function showTip(el, kind, i, j){
  const nm = x => x || '…';
  const txt = kind==='rel'  ? `${nm(S.whats[i].name)}  ↔  ${nm(S.hows[j].name)}`
            : kind==='roof' ? `${nm(S.hows[i].name)}  ↔  ${nm(S.hows[j].name)}`
            : kind==='rate' ? `${nm(S.whats[i].name)}  ↔  ${nm(S.comps[j].name)}`
            : kind==='w'    ? `${nm(S.whats[i].name)} · Gewichtung`
            : kind==='dir'  ? `${nm(S.hows[j].name)} · Optimierung` : '';
  if(!txt) return;
  tip.textContent = txt; tip.hidden = false;
  const r = el.getBoundingClientRect(), vw = innerWidth, vh = innerHeight, tw = tip.offsetWidth, th = tip.offsetHeight;
  let top = r.top - th - 8; if(top < 8) top = Math.min(r.bottom + 8, vh - th - 8);
  tip.style.left = Math.max(8, Math.min(r.left + r.width/2 - tw/2, vw - tw - 8)) + 'px';
  tip.style.top = top + 'px';
}
function commit(v){
  if(!edit) return; hideTip(); clearHl(); const {kind,i,j} = edit;
  if(kind==='rel') setRel(i,j,v); else if(kind==='roof') setRoof(i,j,v); else if(kind==='w') setW(i,v); else if(kind==='dir') setDir(j,v); else if(kind==='rate') setRate(i,j,v);
  edit = null; /* paintCell in set* hat die Zelle schon normal gezeichnet */
}

/* ---------- Ereignisse im Haus ---------- */
house.addEventListener('click', e=>{
  if(mode==='eval'){ evClick(e); return; }
  const act = e.target.closest('[data-act]');
  if(act){
    if(act.dataset.act==='addWhat') addWhat();
    else if(act.dataset.act==='addHow') addHow();
    else if(act.dataset.act==='delWhat') arm(act, ()=>delWhat(+act.dataset.i), '×?');
    else if(act.dataset.act==='delHow') arm(act, ()=>delHow(+act.dataset.j), '×?');
    else if(act.dataset.act==='addCmp') addCmp();
    else if(act.dataset.act==='delCmp') arm(act, ()=>delCmp(+act.dataset.j), '×?');
    else if(act.dataset.act==='rotTgt') rotTgt(+act.dataset.j);
    return;
  }
  const cand = e.target.closest('[data-set]');
  if(cand && edit && edit.el.contains(cand)){
    const v = +cand.dataset.set;
    commit(v);
    return;
  }
  const cell = e.target.closest('[data-cell]'); if(!cell) return;
  if(brush && applyBrush(cell)) return;
  if(cell.dataset.cell==='how' || cell.dataset.cell==='cmp'){ exitEdit(); const sp = cell.querySelector('[contenteditable]'); if(sp && document.activeElement!==sp) focusEnd(sp); return; }
  if(edit && edit.el===cell) return;
  enterEdit(cell);
});
function caretPos(el){
  try{ const sel = getSelection(); if(!sel.rangeCount) return el.textContent.length;
    const r = sel.getRangeAt(0).cloneRange(); r.selectNodeContents(el); r.setEnd(sel.getRangeAt(0).endContainer, sel.getRangeAt(0).endOffset);
    return r.toString().length; }catch(e){ return el.textContent.length; }
}
function setCaret(el, n){
  try{ const node = el.firstChild; if(!node) return; const r = document.createRange();
    r.setStart(node, Math.min(n, node.length)); r.collapse(true);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }catch(e){}
}
function focusEnd(el){ el.focus(); try{ const r = document.createRange(); r.selectNodeContents(el); r.collapse(false); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); }catch(e){} }
house.addEventListener('input', e=>{
  const t = e.target, d = t.dataset;
  let txt = t.textContent.replace(/[\r\n]+/g,' ');
  if(/\^[23]/.test(txt)){                       /* mm^2 -> mm², m^3 -> m³ */
    const cut = txt.slice(0, caretPos(t)).replace(/\^2/g,'²').replace(/\^3/g,'³');
    txt = txt.replace(/\^2/g,'²').replace(/\^3/g,'³');
    t.textContent = txt; setCaret(t, cut.length);

/* ---------- Code: Bit-Packung ---------- */
class Bits{
  constructor(){ this.b = []; this.pos = 0; }
  static fromBytes(bytes){ const B = new Bits(); for(const x of bytes) for(let k=7;k>=0;k--) B.b.push((x>>k)&1); return B; }
  w(v,n){ for(let k=n-1;k>=0;k--) this.b.push((v>>k)&1); return this; }
  r(n){ let v = 0; for(let k=0;k<n;k++) v = (v<<1) | (this.b[this.pos++]||0); return v; }
  get left(){ return this.b.length - this.pos; }
  align(n){ while(this.pos % n) this.pos++; }
  bytes(){ const out = new Uint8Array(Math.ceil(this.b.length/8)); this.b.forEach((x,i)=>{ out[i>>3] |= x << (7-(i&7)); }); return out; }
}
const RELI = {0:0,1:1,3:2,9:3}, RELV = [0,1,3,9], DIRI = {0:0,1:1,'-1':2}, DIRV = [0,1,-1];
/* Struktur: m,n (6 Bit) · Gewichte 4 Bit · Richtungen 2 Bit · Beziehungen 2 Bit · Dach: 3 Werte (0–4) je 7 Bit */
function writeStruct(B, st){
  const m = st.whats.length, n = st.hows.length;
  B.w(m,6).w(n,6);
  st.whats.forEach(w=>B.w(w.w||0,4));
  st.hows.forEach(h=>B.w(DIRI[h.dir]||0,2));
  for(let i=0;i<m;i++) for(let j=0;j<n;j++) B.w(RELI[st.rel[i][j]||0]||0,2);
  const rv = []; for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) rv.push((st.roof[i][j]||0)+2);
  for(let k=0;k<rv.length;k+=3) B.w((rv[k]||0)*25 + (rv[k+1]||0)*5 + (rv[k+2]||0), 7);
  const c = Math.min(15, st.comps.length); B.w(c,4);
  for(let i=0;i<m;i++) for(let k=0;k<c;k++) B.w(Math.min(7, st.rate[i][k]||0), 3);
}
function readStruct(B){
  const m = B.r(6), n = B.r(6);
  if(B.left < m*4 + n*2 + m*n*2) throw new Error('Code unvollständig.');
  const st = mk(m,n);
  st.whats.forEach(w=>{ w.w = B.r(4); });
  st.hows.forEach(h=>{ h.dir = DIRV[B.r(2)] ?? 1; });
  for(let i=0;i<m;i++) for(let j=0;j<n;j++) st.rel[i][j] = RELV[B.r(2)];
  const cnt = n*(n-1)/2, rv = [];
  for(let k=0;k<cnt;k+=3){ let v = B.r(7); rv.push(Math.floor(v/25)); v %= 25; rv.push(Math.floor(v/5)); rv.push(v%5); }
  let k = 0; for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) { const x = rv[k++]; st.roof[i][j] = x===undefined ? 0 : Math.max(-2, Math.min(2, x-2)); }
  const c = B.r(4); st.comps = Array.from({length:c},()=>({name:''}));
  st.rate = Array.from({length:m},()=>Array.from({length:c},()=>Math.min(5, B.r(3))));
  return st;
}
/* Texte: 6-Bit-Alphabet, 61 = Großbuchstabe folgt, 62 = beliebiges Zeichen (16 Bit), 63 = Ende */
const ALPHA = " abcdefghijklmnopqrstuvwxyzäöüß0123456789-.,/()%+:;=<>≥≤°×µ'\"";
function writeText(B, str){
  for(const ch of String(str)){
    const lo = ch.toLowerCase(); let idx = ALPHA.indexOf(lo);
    if(idx >= 0 && lo.length===1 && ch.length===1){ if(ch !== lo) B.w(61,6); B.w(idx,6); }
    else { const cu = ch.charCodeAt(0); if(ch.length===1 && cu < 65536){ B.w(62,6).w(cu,16); } else { for(const u of ch){ B.w(62,6).w(u.charCodeAt(0),16); } } }
  }
  B.w(63,6);
}
function readText(B){
  let out = '', up = false;
  while(B.left >= 6){
    const c = B.r(6);
    if(c===63) break;
    if(c===61){ up = true; continue; }
    if(c===62){ out += String.fromCharCode(B.r(16)); continue; }
    let ch = ALPHA[c] || ''; if(up){ ch = ch.toUpperCase(); up = false; } out += ch;
  }
  return out;
}
/* Kurzcode: Crockford-Base32, Vierergruppen, Prüfzeichen */
const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function toB32(B){ const chunks = []; while(B.b.length % 5) B.b.push(0); for(let i=0;i<B.b.length;i+=5){ let v=0; for(let k=0;k<5;k++) v=(v<<1)|B.b[i+k]; chunks.push(v); } return chunks; }
const chk = chunks => chunks.reduce((h,c,i)=>(h + (i%30+1)*c) % 31, 0);
function b64u(bytes){ let s=''; for(let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function fromB64u(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s += '='; const bin = atob(s); const out = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i); return out; }
async function pipe(stream, bytes){ const p = new Response(stream.readable).arrayBuffer(); const w = stream.writable.getWriter(); await w.write(bytes); await w.close(); return new Uint8Array(await p); }

function shortCode(){
  const B = new Bits(); writeStruct(B, S);
  const chunks = toB32(B); chunks.push(chk(chunks));
  const str = chunks.map(c=>B32[c]).join('');
  const nm = (DOC.author||'').replace(/[~\s]+/g,' ').trim();
  return 'K' + str.replace(/(.{4})/g,'$1-').replace(/-$/,'') + (nm ? '~' + nm : '');
}
async function fullCode(){
  const texts = [DOC.title, ...S.whats.map(w=>w.name), ...S.hows.map(h=>h.name), ...S.hows.map(h=>h.target), ...S.comps.map(x=>x.name)];
  const B = new Bits(); writeStruct(B, S); texts.forEach(t=>writeText(B, t));
  let best = 'V' + b64u(B.bytes());
  if(typeof CompressionStream!=='undefined'){
    try{
      const A = new Bits(); writeStruct(A, S); const head = A.bytes();
      const z = await pipe(new CompressionStream('deflate-raw'), new TextEncoder().encode(texts.join('\n')));
      const all = new Uint8Array(head.length + z.length); all.set(head); all.set(z, head.length);
      const w = 'W' + b64u(all); if(w.length < best.length) best = w;
    }catch(e){}
  }
  return best;
}
const clampInt = (v,lo,hi,d) => { v = Math.round(+v); return isNaN(v) ? d : Math.max(lo, Math.min(hi, v)); };
function unpackLegacy(o){
  if(!o || o.v!==1 || !Array.isArray(o.w) || !Array.isArray(o.h)) throw new Error('Kein QFD-Code.');
  const whats = o.w.map(a=>({name:String(a[0]??''), w:clampInt(a[1],0,9,5)}));
  const hows = o.h.map(a=>({name:String(a[0]??''), dir:[1,-1,0].includes(+a[1])?+a[1]:1, target:String(a[2]??'')}));
  const m = whats.length, n = hows.length, r = String(o.r||''), c = String(o.c||'');
  const rel = Array.from({length:m},(_,i)=>Array.from({length:n},(_,j)=>{ const v = +r[i*n+j]; return [1,3,9].includes(v)?v:0; }));
  const roof = Array.from({length:n},()=>Array(n).fill(0)); let k = 0;
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){ const v = +c[k++]-2; roof[i][j] = isNaN(v)?0:Math.max(-2,Math.min(2,v)); }
  return {title:String(o.t||''), whats, hows, rel, roof, comps:[], rate:whats.map(()=>[])};
}
/* liefert {state, structOnly} */
async function decodeCode(str){
  let raw = String(str).trim(), name = '';
  const ti = raw.indexOf('~'); if(ti > 0){ name = raw.slice(ti+1).trim(); raw = raw.slice(0, ti).trim(); }
  const bad = () => new Error('Code unvollständig oder beschädigt.');
  if(/^k/i.test(raw)){
    const t = raw.slice(1).toUpperCase().replace(/[^0-9A-Z]/g,'').replace(/O/g,'0').replace(/[IL]/g,'1');
    if(t.length < 4) throw bad();
    const chunks = [...t].map(ch=>B32.indexOf(ch)); if(chunks.includes(-1)) throw bad();
    const c = chunks.pop(); if(chk(chunks)!==c) throw new Error('Prüfzeichen passt nicht – bitte Code vergleichen.');
    const B = new Bits(); chunks.forEach(v=>B.w(v,5));
    return {state: readStruct(B), structOnly: true, name};
  }
  const s = raw.replace(/\s+/g,'');
  let m;
  if((m = /^([VW])([A-Za-z0-9_\-]+)$/.exec(s))){
    let bytes; try{ bytes = fromB64u(m[2]); }catch(e){ throw bad(); }
    const B = Bits.fromBytes(bytes), st = readStruct(B);
    let texts;
    if(m[1]==='V'){ texts = []; const cnt = 1 + st.whats.length + 2*st.hows.length + st.comps.length; for(let k=0;k<cnt;k++) texts.push(readText(B)); }
    else {
      if(typeof DecompressionStream==='undefined') throw new Error('Dieser Browser kann den Code nicht lesen.');
      B.align(8); const rest = bytes.subarray(B.pos/8);
      try{ texts = new TextDecoder().decode(await pipe(new DecompressionStream('deflate-raw'), rest)).split('\n'); }catch(e){ throw bad(); }
    }
    let k = 0; st.title = texts[k++]||''; st.whats.forEach(w=>{ w.name = texts[k++]||''; }); st.hows.forEach(h=>{ h.name = texts[k++]||''; }); st.hows.forEach(h=>{ h.target = texts[k++]||''; }); st.comps.forEach(x=>{ x.name = texts[k++]||''; });
    return {state: st, structOnly: false, name};
  }
  if((m = /^QFD([01])-?([A-Za-z0-9_\-]+)$/.exec(s))){
    let bytes; try{ bytes = fromB64u(m[2]); }catch(e){ throw bad(); }
    if(m[1]==='1'){ if(typeof DecompressionStream==='undefined') throw new Error('Dieser Browser kann den Code nicht lesen.'); try{ bytes = await pipe(new DecompressionStream('deflate-raw'), bytes); }catch(e){ throw bad(); } }
    let obj; try{ obj = JSON.parse(new TextDecoder().decode(bytes)); }catch(e){ throw bad(); }
    return {state: unpackLegacy(obj), structOnly: false, name};
  }
  throw new Error('Kein QFD-Code.');
}

/* ---------- Hell / Dunkel ---------- */
const root = document.documentElement, btnTheme = $('#btnTheme');
function applyTheme(t, animate){
  if(animate && !matchMedia('(prefers-reduced-motion: reduce)').matches){ root.classList.add('theming'); clearTimeout(applyTheme._t); applyTheme._t = setTimeout(()=>root.classList.remove('theming'), 450); }
  root.dataset.theme = t; btnTheme.textContent = t==='dark' ? '☀' : '☾'; try{ localStorage.setItem('qfd.theme', t); }catch(e){} }
btnTheme.addEventListener('click', ()=>{ applyTheme(root.dataset.theme==='dark' ? 'light' : 'dark', true); btnTheme.classList.remove('spin'); void btnTheme.offsetWidth; btnTheme.classList.add('spin'); });
btnTheme.addEventListener('animationend', ()=>btnTheme.classList.remove('spin'));
const menu = $('#btnMenu');
menu.addEventListener('click', e=>{ e.stopPropagation(); document.body.classList.toggle('menu-open'); });
$('.top .actions').addEventListener('click', e=>{
  const b = e.target.closest('button');
  if(b && b.classList.contains('armed')) return;   /* erste Stufe von "Neu": Menü offen lassen */
  document.body.classList.remove('menu-open');
});
document.addEventListener('pointerdown', e=>{
  if(document.body.classList.contains('menu-open') && !e.target.closest('.top')){
    document.body.classList.remove('menu-open');
    document.querySelectorAll('.top .actions .armed').forEach(b=>{ b.classList.remove('armed'); clearTimeout(b._t); if(b._orig) b.textContent = b._orig; });
  }
});
let theme = 'light'; try{ theme = localStorage.getItem('qfd.theme') || 'light'; }catch(e){}
applyTheme(theme);

/* ---------- Auswertung ---------- */
let mode = 'edit';
const EV = { entries: [], sel: null, cell: null, stats: null };
const ORD = {0:0,1:1,3:2,9:3}, ORDV = [0,1,3,9];
const fmt1 = x => x.toFixed(1).replace('.', ',');
function evSave(){ try{ localStorage.setItem('qfd.eval', JSON.stringify(EV.entries.map(e=>({name:e.name, code:e.code})))); }catch(e){} }
/* Codes aus beliebigem Text herausfischen (Forms-Tabellen, Chat, mehrere pro Zeile); Name = Rest der Zeile */
function extractCodes(text){
  const out = [];
  const re = /(QFD[01]-?[A-Za-z0-9_\-]{8,}|\b[VW](?=[A-Za-z0-9_\-]*\d)[A-Za-z0-9_\-]{24,}|\bK[0-9A-Z][0-9A-Z\-]{12,})(~[^\t;,\r\n]*)?/g;
  String(text).split(/\r?\n/).forEach(line=>{
    let m, rest = line, found = [];
    while((m = re.exec(line))){ found.push(m); rest = rest.replace(m[0], ' '); }
    if(!found.length) return;
    const fields = rest.split(/[\t;,]+/).map(f=>f.replace(/^["'\s]+|["'\s]+$/g,''))
      .filter(f=>f && !/^[\d.:\/ \-]+$/.test(f) && !/@/.test(f) && !/^\d{1,4}[.\/-]\d{1,2}/.test(f));
    const lineName = fields.join(' ').replace(/[\s:–\-]+$/,'').trim();
    found.forEach(m=>out.push({code:m[1], name:(m[2]||'').slice(1).trim() || lineName}));
  });
  return out;
}
async function evAdd(text){
  const found = extractCodes(text); let added = 0, dup = 0; const bad = [];
  for(const f of found){
    if(EV.entries.some(e=>e.code===f.code)){ dup++; continue; }
    try{
      const r = await decodeCode(f.code), st = r.state;
      if(st.whats.length!==S.whats.length || st.hows.length!==S.hows.length){ bad.push(`${f.name||f.code.slice(0,10)}: ${st.whats.length}×${st.hows.length}`); continue; }
      EV.entries.push({name: f.name || r.name || '', code: f.code, st}); added++;
    }catch(e){ bad.push(`${f.code.slice(0,12)}…: ${e.message}`); }
  }
  EV.entries.forEach((e,i)=>{ if(!e.name) e.name = '#' + (i+1); });
  evSave();
  return {found: found.length, added, dup, bad};
}
function evStats(){
  const m = S.whats.length, n = S.hows.length, c = S.comps.length, E = EV.entries, N = E.length;
  const cells = Array.from({length:m},()=>Array.from({length:n},()=>({counts:[0,0,0,0], mean:0, raw:0, mode:0, agree:0})));
  E.forEach(e=>{ for(let i=0;i<m;i++) for(let j=0;j<n;j++) cells[i][j].counts[ORD[e.st.rel[i][j]||0]||0]++; });
  cells.forEach(row=>row.forEach(cl=>{
    const ct = cl.counts; if(!N) return;
    cl.mean = ct.reduce((a,x,k)=>a+x*k,0)/N; cl.raw = ct.reduce((a,x,k)=>a+x*ORDV[k],0)/N;
    cl.mode = Math.round(cl.mean); cl.agree = ct[cl.mode]/N; cl.tie = false; /* Symbol = gerundeter Mittelwert, Einigkeit = Anteil genau dieses Symbols */
  }));
  const roof = Array.from({length:n},()=>Array(n).fill(null));
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
    const ct = [0,0,0,0,0]; E.forEach(e=>{ ct[(e.st.roof[i][j]||0)+2]++; });
    const mean = N ? ct.reduce((a,x,k)=>a+x*(k-2),0)/N : 0, md = Math.round(mean) || 0;
    roof[i][j] = {counts:ct, mean, mode: md, agree: N ? ct[md+2]/N : 0, tie: false};
  }
  const rate = Array.from({length:m},()=>Array(c).fill(0));
  const Ec = E.filter(e=>e.st.comps.length===c);
  if(Ec.length) for(let i=0;i<m;i++) for(let k=0;k<c;k++) rate[i][k] = Ec.reduce((a,e)=>a+(e.st.rate[i][k]||0),0)/Ec.length;
  E.forEach(e=>{
    let d = 0; const contra = [];
    for(let i=0;i<m;i++) for(let j=0;j<n;j++){
      const o = ORD[e.st.rel[i][j]||0]||0, cl = cells[i][j]; d += Math.abs(o - cl.mean);
      if(!cl.tie && cl.agree >= 0.6 && Math.abs(o - cl.mode) >= 2) contra.push([i,j]);
    }
    e.dist = m*n ? d/(m*n) : 0; e.contra = contra;
  });
  EV.stats = {cells, roof, rate, N};
}
function decorateEval(){
  evStats(); const {cells, roof, rate, N} = EV.stats;
  const sel = EV.sel!==null && EV.entries[EV.sel] ? EV.entries[EV.sel] : null;
  house.classList.add('ev');
  S.whats.forEach((w,i)=>S.hows.forEach((h,j)=>{
    const el = house.querySelector(`td[data-cell="rel"][data-i="${i}"][data-j="${j}"]`), cl = cells[i][j];
    if(!sel){
      const t = N ? cl.mean/3 : 0;
      el.className = `cell rel hm${t>0.5?' hi':''}`; el.style.setProperty('--t', t.toFixed(3));
      el.innerHTML = N ? `${cl.tie ? '<span class="dot">?</span>' : (REL[ORDV[cl.mode]]||'<span class="dot">·</span>')}<span class="ag">${Math.round(cl.agree*100)}</span>` : '';
    } else {
      const v = sel.st.rel[i][j]||0, o = ORD[v]||0, diff = !cl.tie && o!==cl.mode, contra = sel.contra.some(([a,b])=>a===i&&b===j);
      el.className = `cell rel v${v}${contra?' contra':diff?' diff':''}`; el.style.removeProperty('--t');
      el.innerHTML = (REL[v]||'') + (diff ? `<span class="maj">${REL[ORDV[cl.mode]]||'·'}</span>` : '');
    }
    if(EV.cell && EV.cell.kind==='rel' && EV.cell.i===i && EV.cell.j===j) el.classList.add('picked');
  }));
  const n = S.hows.length;
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
    const g = house.querySelector(`g[data-cell="roof"][data-i="${i}"][data-j="${j}"]`); if(!g) continue;
    const r = roof[i][j], tx = g.querySelector('text');
    tx.setAttribute('class',''); if(!sel){ g.setAttribute('class', `rc hm ${r.mean>0?'pos':r.mean<0?'neg':''}`); g.style.setProperty('--t', (Math.abs(r.mean)/2).toFixed(3)); tx.textContent = N ? (r.tie ? '?' : (ROOF[r.mode]||'')) : ''; }
    else { const v = sel.st.roof[i][j]||0; g.setAttribute('class', `rc v${v}`); g.style.removeProperty('--t'); tx.textContent = ROOF[v]||''; }
    if(EV.cell && EV.cell.kind==='roof' && EV.cell.i===i && EV.cell.j===j) g.classList.add('picked');
  }
  S.whats.forEach((w,i)=>S.comps.forEach((x,k)=>{
    const el = house.querySelector(`td[data-cell="rate"][data-i="${i}"][data-j="${k}"]`); if(!el) return;
    el.textContent = sel ? (sel.st.comps.length===S.comps.length ? (sel.st.rate[i][k]||'') : '') : (rate[i][k] ? fmt1(rate[i][k]) : '');
  }));
  updateFooter(sel ? sel.st.rel : cells.map(row=>row.map(cl=>cl.raw)));
  evPanel();
}
function evPanel(){
  const order = EV.entries.map((e,i)=>({e,i})).sort((a,b)=>a.e.dist-b.e.dist);
  let h = `<div class="evrow cls${EV.sel===null?' sel':''}" data-sel="-1"><span class="nm">Klasse</span><span class="d">${EV.entries.length}</span></div>`;
  h += order.map(({e,i})=>`<div class="evrow${EV.sel===i?' sel':''}" data-sel="${i}"><span class="nm">${esc(e.name)}</span><span class="k">${e.contra.length ? '⚡'+e.contra.length : ''}</span><span class="d">${e.dist.toFixed(2).replace('.',',')}</span></div>`).join('');
  $('#evList').innerHTML = h;
  const cd = $('#evCell'), st = EV.stats;
  if(!EV.cell || !st.N){ cd.innerHTML = ''; return; }
  if(EV.cell.kind==='rel'){
    const cl = st.cells[EV.cell.i][EV.cell.j], ct = cl.counts;
    cd.innerHTML = `<b>${esc(S.whats[EV.cell.i].name)}</b><b>↔ ${esc(S.hows[EV.cell.j].name)}</b><div class="res">` + [3,2,1,0].map(k=>`<span>${REL[ORDV[k]]||'·'} ${ct[k]}</span>`).join('') + `<span>Ø ${fmt1(cl.mean)}</span></div>`;
  } else {
    const r = st.roof[EV.cell.i][EV.cell.j], ct = r.counts;
    cd.innerHTML = `<b>${esc(S.hows[EV.cell.i].name)}</b><b>↔ ${esc(S.hows[EV.cell.j].name)}</b><div class="res">` + [4,3,2,1,0].map(k=>`<span>${ROOF[k-2]||'·'} ${ct[k]}</span>`).join('') + `<span>Ø ${fmt1(r.mean)}</span></div>`;
  }
}
function evClick(e){
  const cell = e.target.closest('[data-cell]'); if(!cell) return;
  const k = cell.dataset.cell; if(k!=='rel' && k!=='roof') return;
  const i = +cell.dataset.i, j = +cell.dataset.j;
  EV.cell = (EV.cell && EV.cell.kind===k && EV.cell.i===i && EV.cell.j===j) ? null : {kind:k, i, j};
  decorateEval();
}
function setMode(m){
  mode = m;
  document.body.classList.toggle('evmode', m==='eval');
  $('#evpanel').hidden = m!=='eval';
  $('#btnEval').textContent = m==='eval' ? 'Bearbeiten' : 'Auswertung';
  $('#btnEval').classList.toggle('primary', m==='eval');
  if(m==='eval'){ setBrush(null); exitEdit(); }
  fitMode = true; render();
}
$('#btnEval').addEventListener('click', ()=>setMode(mode==='eval' ? 'edit' : 'eval'));
$('#evAdd').addEventListener('click', async ()=>{
  const r = await evAdd($('#evIn').value);
  const msg = $('#evMsg');
  msg.textContent = r.found ? `${r.added} neu` + (r.dup ? `, ${r.dup} doppelt` : '') + (r.bad.length ? `, ${r.bad.length} unbrauchbar: ${r.bad.join(' · ')}` : '') : 'Kein Code gefunden';
  msg.className = 'm ' + (r.bad.length ? 'err' : 'ok');
  if(r.added) $('#evIn').value = '';
  render();
});
$('#evList').addEventListener('click', e=>{
  const row = e.target.closest('[data-sel]'); if(!row) return;
  const i = +row.dataset.sel; EV.sel = i < 0 ? null : i; decorateEval();
});
$('#evCopy').addEventListener('click', e=>copyText(EV.entries.map(x=>`${x.name}\t${x.code}`).join('\n'), e.currentTarget, $('#evIn')));
$('#evClear').addEventListener('click', e=>arm(e.currentTarget, ()=>{ EV.entries = []; EV.sel = null; EV.cell = null; evSave(); render(); }, 'Wirklich?'));
async function evLoad(){
  let list = []; try{ list = JSON.parse(localStorage.getItem('qfd.eval')||'[]'); }catch(e){}
  for(const x of list){ try{ const r = await decodeCode(x.code); EV.entries.push({name:x.name||r.name||'', code:x.code, st:r.state}); }catch(e){} }
}

/* ---------- Phasen ---------- */
function renderPhases(){
  const n = DOC.phases.length;
  let h = DOC.phases.map((ph,k)=>`<button type="button" class="ph${k===DOC.active?' on':''}" tabindex="-1" data-ph="${k}"><b>${k+1}</b>${SHORT[k+1].length > 9 ? `<span class="p1">${SHORT[k]} →</span><span class="p2">${SHORT[k+1]}</span>` : `<span class="p1">${SHORT[k]}</span><span class="p2">→ ${SHORT[k+1]}</span>`}${k===n-1 && n>1 ? '<span class="x" data-delph="'+k+'">×</span>' : ''}</button>`).join('');
  if(n < MAXPH) h += `<button type="button" class="ph add" tabindex="-1" data-addph="1"><span class="p1">+</span><span class="p2">${SHORT[n+1]}</span></button>`;
  $('#phases').innerHTML = h;
  $('#phases').hidden = false;
}
function setPhase(k){
  DOC.active = Math.max(0, Math.min(DOC.phases.length-1, k));
  S = DOC.phases[DOC.active];
  syncPhase(DOC.active);
  setBrush(null); fitMode = true; render();
}
function addPhase(){
  if(DOC.phases.length >= MAXPH) return;
  const prev = DOC.phases[DOC.phases.length-1];
  DOC.phases.push(mk(prev.hows.length, 3));
  setPhase(DOC.phases.length-1);
}
$('#phases').addEventListener('click', e=>{
  const del = e.target.closest('[data-delph]');
  if(del){ e.stopPropagation(); arm(del, ()=>{ DOC.phases.pop(); setPhase(DOC.phases.length-1); }, '×?'); return; }
  const add = e.target.closest('[data-addph]'); if(add){ addPhase(); return; }
  const b = e.target.closest('[data-ph]'); if(b) setPhase(+b.dataset.ph);
});

/* ---------- Start ---------- */
function normDoc(o){
  if(!o) return null;
  if(o.phases) { o.active = Math.min(o.active||0, o.phases.length-1); }
  else if(o.whats && o.hows) o = {title:o.title||'', author:o.author||'', active:0, phases:[o]};
  else return null;
  o.phases.forEach(ph=>{ ph.comps = ph.comps||[]; ph.rate = ph.rate||ph.whats.map(()=>[]); ph.seen = ph.seen||{}; });
  return o;
}
async function start(hot){
  if(hot && (hot.phases || hot.whats)){ DOC = normDoc(hot); }
  if(!DOC){
    const h = location.hash.slice(1);
    if(/^(QFD[01]-|[KVWPQR])/.test(h)){ try{ const st = (await decodeCode(decodeURIComponent(h))).state; DOC = normDoc({title:st.title||'', author:'', active:0, phases:[st]}); try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){} }catch(e){} }
    if(!DOC){ try{ const raw = localStorage.getItem(LS); if(raw) DOC = normDoc(JSON.parse(raw)); }catch(e){} }
    if(!DOC) DOC = sample();
  }
  S = DOC.phases[DOC.active];
  setBrush(null); render();
  evLoad();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
}
document.querySelectorAll('.top button, .zoombar button').forEach(b=>{ b.tabIndex = -1; });
window.claude?.hot?.snapshot?.(()=>DOC);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
